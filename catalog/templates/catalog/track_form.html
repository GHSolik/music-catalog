
{% extends "base.html" %}

{% block title %}Добавление трека{% endblock %}

{% block content %}

<div class="content-form-container">

    <h1>Добавление трека</h1>

    <p class="page-subtitle">
        Альбом: <strong>{{ album.title }}</strong>
    </p>

    <form method="post"
          enctype="multipart/form-data"
          class="content-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="button">
                Сохранить трек
            </button>

            <a href="{% url 'album_detail' album.pk %}"
               class="button button-secondary">
                Отмена
            </a>

        </div>

    </form>

</div>

{% endblock %}
