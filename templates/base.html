
{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Music Catalog{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header class="site-header">
    <div class="container header-content">

        <a href="{% url 'home' %}" class="site-logo">
            <span class="vinyl-logo" aria-hidden="true"></span>
            <span>Music<span class="accent">Catalog</span></span>
        </a>

        <nav class="main-nav" aria-label="Основная навигация">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'artist_list' %}">Исполнители</a>
            <a href="{% url 'album_list' %}">Альбомы</a>
        </nav>

        <div class="header-actions">
            {% block header_actions %}
            {% endblock %}
        </div>

    </div>
</header>

<main class="site-main">
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-content">
        <p>Music Catalog — музыкальная энциклопедия</p>
        <p>2026</p>
    </div>
</footer>

</body>
</html>
